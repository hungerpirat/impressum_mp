<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Impressum und Kontaktdaten von Kiosk Wilking in Hemer.">
  <title>Impressum · Kiosk Wilking</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      margin: 0;
      padding: 48px 20px;

      color: #262624;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      max-width: 620px;

      border: 1px solid #e4e3de;

    p { margin: 0; }

    section { margin-top: 32px; }
    address { margin-top: 16px; font-style: normal; }
    a { color: #245b50; text-underline-offset: 3px; overflow-wrap: anywhere; }
    a:hover { text-decoration-thickness: 2px; }
    a:focus-visible { outline: 2px solid #245b50; outline-offset: 4px; }
    @media (max-width: 420px) { body { padding: 24px 16px; } }

</head>
<body>
  <main>
